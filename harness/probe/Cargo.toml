[package]
name = "netprobe"
version = "1.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
hdrhistogram = "7.6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }

[build-dependencies]
cc = "1"

