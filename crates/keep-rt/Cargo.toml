[package]
name = "keep-rt"
version = "1.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
tls = ["dep:rustls"]

[dependencies]
libc = "0.2"
rtrb = "0.4"
rustls = { version = "0.23.46", default-features = false, features = ["std"], optional = true }
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints]
workspace = true
