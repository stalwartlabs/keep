[package]
name = "keep-server"
version = "1.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "keep"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
foldhash = "0.2"
getrandom = { version = "0.4", features = ["std"] }
keep-cluster = { path = "../keep-cluster" }
keep-engine = { path = "../keep-engine" }
keep-proto = { path = "../keep-proto", features = ["tls"] }
keep-rt = { path = "../keep-rt", features = ["tls"] }
libc = "0.2"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[lints]
workspace = true
